name: Munetips NBA Cloud Scanner (24/7 Sin PC)

on:
  schedule:
    # 3 Ventanas de Oro NBA (optimizadas para que los 500 créditos gratuitos duren los 30 días del mes):
    # 1. Mañana (Apertura consolidada + liquidación de ayer): 11:15 AM CDMX (17:15 UTC)
    - cron: '15 17 * * *'
    # 2. Tarde (Reportes oficiales de lesiones pre-partido): 4:30 PM CDMX (22:30 UTC)
    - cron: '30 22 * * *'
    # 3. Pre-Tipoff (Confirmación de quintetos iniciales): 5:45 PM CDMX (23:45 UTC)
    - cron: '45 23 * * *'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - demo
          - find-channel

permissions:
  contents: write

concurrency:
  group: munetips-nba-scanner-${{ github.event.inputs.modo || 'scan' }}
  cancel-in-progress: false

jobs:
  escanear_nba_playdoit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar Agente Cuantitativo Munetips (Ejecucion Unica Limpia)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BANKROLL_MXN: '200.0'
        run: |
          git config user.name "Munetips Quant Bot"
          git config user.email "bot@munetips.local"

          MODO="${{ github.event.inputs.modo }}"
          if [ "$MODO" = "demo" ]; then
            python main.py --demo
            exit 0
          elif [ "$MODO" = "find-channel" ]; then
            python main.py --find-channel
            exit 0
          fi

          git pull --rebase origin main || true
          # 1. Auditar y calificar automáticamente los partidos finalizados en ESPN Boxscore
          python scripts/verificar_resultados.py || true

          # 2. Escanear nuevos mercados en vivo
          python main.py --scan
          mkdir -p data
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore(data): actualizar bitacora CLV, resultados y cache NBA"
          git push origin main || true
