name: Munetips NBA Cloud Scanner (24/7 Sin PC)

on:
  schedule:
    # Ejecuta en minutos fuera de hora pico (:12 y :42) para evitar retrasos en la cola de GitHub
    - cron: '12,42 * * * *'

  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecucion'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - demo
          - find-channel

permissions:
  contents: write

jobs:
  escanear_nba_playdoit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar Agente Cuantitativo Munetips
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BANKROLL_MXN: '200.0'
        run: |
          if [ "${{ github.event.inputs.modo }}" = "demo" ]; then
            python main.py --demo
          elif [ "${{ github.event.inputs.modo }}" = "find-channel" ]; then
            python main.py --find-channel
          else
            python main.py --scan
          fi

      - name: Guardar bitacora CLV y cache de lesiones
        run: |
          git config user.name "Munetips Quant Bot"
          git config user.email "bot@munetips.local"
          mkdir -p data
          git add data/ || true
          git diff --staged --quiet || git commit -m "chore(data): actualizar bitacora CLV"
          git push || true
